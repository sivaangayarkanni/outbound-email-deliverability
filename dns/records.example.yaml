# Copy to records.yaml and replace placeholders.
# Publish via your DNS host (Cloudflare, Route53, Google Cloud DNS, etc.).

domain: example.com
ttl_seconds: 3600

txt:
  - name: "@"
    purpose: SPF (exactly one record)
    value: "v=spf1 include:_spf.google.com ip4:203.0.113.10 -all"

  - name: "s1._domainkey"
    purpose: DKIM selector s1 (self-hosted MTA, 2048-bit)
    value: "v=DKIM1; k=rsa; p=REPLACE_WITH_PUBLIC_KEY"

  - name: "google._domainkey"
    purpose: DKIM selector for Google Workspace
    value: "v=DKIM1; k=rsa; p=REPLACE_WITH_GOOGLE_DKIM_KEY"

  - name: "_dmarc"
    purpose: DMARC phase 0 (monitoring)
    value: "v=DMARC1; p=none; rua=mailto:dmarc-reports@example.com; ruf=mailto:dmarc-forensics@example.com; fo=1; adkim=r; aspf=r; pct=100"

a:
  - name: mail
    value: "203.0.113.10"

# PTR is set at the IP provider, not in this zone:
#   203.0.113.10  PTR  mail.example.com

mx:
  - name: "@"
    priority: 10
    value: "mail.example.com."
